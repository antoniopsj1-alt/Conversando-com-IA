<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
          <meta name="keywords" content="Antonio Pereira de Souza Junior, Aplicativo Conversar IA, Pedido Puter, resposta IA">
            <meta name="author" content="Antônio Pereira de Souza Junior">

    <title>FazAí IA</title>

    <link rel="stylesheet"
          href="styles.css">

    <!-- PUTER -->
    <script src="https://js.puter.com/v2/"></script>

    <!-- JSPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

    <div class="card">

        <div class="header">
            <h2>FazAí IA</h2>
            <span class="badge">Puter</span>
        </div>

        <textarea
            id="prompt"
            placeholder="Digite sua pergunta aqui..."></textarea>

        <div class="pedido-box">

            <span class="titulo-box">
                Pedido
            </span>

            <div class="controls">

                <button id="btnGravar" type="button">
                    🎙 Gravar Áudio
                </button>

                <button id="btnParar" type="button">
                    ■ Parar
                </button>

                <button id="btnLerTexto" type="button">
                    🔊 Ouvir Pedido
                </button>

                <button id="btnEnviar" type="button">
                    Enviar
                </button>

                <button id="btnLimpar" type="button">
                    🧹 Limpar
                </button>

            </div>

        </div>

        <div id="status" class="status">

            <span class="status-indicator"></span>

            <span class="status-text">
                Aguardando...
            </span>

        </div>

        <div class="resposta-box">

            <h3>Resposta</h3>

            <div id="resultado"
                 class="result-preview"
                 aria-live="polite">

                Sua resposta aparecerá aqui.

            </div>

            <div class="resposta-actions">

                <button id="btnLerResposta" type="button">
                    🔊 Ouvir Resposta
                </button>

                <button id="btnPausarResposta" type="button">
                    ⏸ Pausar
                </button>

                <button id="btnContinuarResposta" type="button">
                    ▶ Continuar
                </button>

                <button id="btnPararResposta" type="button">
                    ■ Parar Leitura
                </button>

                <button id="btnCopiarResposta" type="button">
   		 📋 Copiar Ctrl+C
		</button>

            </div>

        </div>

        <footer>

                  <p style="text-align: center;">
                  <a href="https://antoniopsj1-alt.github.io/Portfolio-AntonioJunior/" target="_blank" style="text-decoration: none; color: inherit;">
                   &copy; 2026 Antônio Pereira de Souza Junior.
                  </a>
                  </p>
			        <p style="text-align: center;">Todos os direitos reservados.</p>
			        <address style="text-align: center; color: blue; text-weight: bold;">
			        Contato: <a href="mailto:antoniopsj1@gmail.com">antoniopsj1@gmail.com</a>
			        </address>

        </footer>

    </div>

    <!-- SEU JAVASCRIPT -->
    <script src="scripts.js"></script>

</body>
</html>
